<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Registration</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-xl shadow-lg overflow-hidden">
    <!-- Header -->
    <div class="bg-blue-600 text-white p-6 text-center">
      <h1 class="text-2xl font-bold mb-2">Event Registration</h1>
      <p class="text-blue-100 text-sm">Please complete your details below</p>
    </div>

    <!-- Step 1: Login Screen -->
    <div id="login-screen" class="p-8 text-center">
      <div class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </div>
      <h2 class="text-xl font-semibold text-gray-800 mb-2">Welcome</h2>
      <p class="text-gray-500 text-sm mb-8">Sign in with Google to autofill your details, or fill in the form manually.</p>

      <button id="google-login-btn" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 rounded-lg px-6 py-3 text-gray-700 font-medium hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>
      <button type="button" id="manual-registration-btn" class="w-full mt-3 py-3 px-6 border border-blue-600 rounded-lg text-blue-600 font-medium hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
        Fill in manually
      </button>
      <p id="error-msg" class="text-red-500 text-sm mt-4 hidden"></p>
    </div>

    <!-- Step 2: Form Screen -->
    <div id="form-screen" class="p-6 hidden">
      <form id="registration-form" class="space-y-4">
        
        <div class="bg-blue-50 p-4 rounded-lg border border-blue-100 mb-6">
          <p class="text-xs text-blue-600 font-semibold uppercase tracking-wider mb-3">Profile Data</p>
          <div class="space-y-3">
            <div>
              <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name *</label>
              <input type="text" id="fullName" name="fullName" required readonly class="mt-1 block w-full bg-transparent border-0 border-b border-blue-200 focus:ring-0 text-gray-900 font-medium px-0 pb-1">
            </div>
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700">Email Address *</label>
              <input type="email" id="email" name="email" required readonly class="mt-1 block w-full bg-transparent border-0 border-b border-blue-200 focus:ring-0 text-gray-600 px-0 pb-1">
            </div>
          </div>
        </div>

        <div>
          <label for="phone" class="block text-sm font-medium text-gray-700">Phone Number *</label>
          <input type="tel" id="phone" name="phone" required placeholder="e.g. +234 800 000 0000" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <div>
          <label for="source" class="block text-sm font-medium text-gray-700">How did you hear about the program? *</label>
          <select id="source" name="source" required class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-white">
            <option value="" disabled selected>Select an option</option>
            <option value="Church Announcement">Church Announcement</option>
            <option value="Social Media">Social Media</option>
            <option value="Friend or Family">Friend or Family</option>
            <option value="Flyer/Poster">Flyer / Poster</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label for="church" class="block text-sm font-medium text-gray-700">Church Denomination/Fellowship *</label>
          <input type="text" id="church" name="church" required placeholder="Enter your church name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <input type="hidden" id="uid" name="uid">

        <div class="pt-4">
          <button type="submit" id="submit-btn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
            Complete Registration
          </button>
        </div>
      </form>
    </div>

    <!-- Step 3: Success Screen -->
    <div id="success-screen" class="p-8 text-center hidden">
      <div class="bg-green-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
        <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h2 class="text-xl font-semibold text-gray-800 mb-2">Registration Complete!</h2>
      <p class="text-gray-500 text-sm">Thank you for registering. Your details have been securely saved.</p>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDss1dwqFFGF32WQnUNEtL0Qtm0AceViFI",
      authDomain: "blc2026.firebaseapp.com",
      projectId: "blc2026",
      storageBucket: "blc2026.firebasestorage.app",
      messagingSenderId: "756920526294",
      appId: "1:756920526294:web:579e38ae8442cc81a97077",
      measurementId: "G-C9E8W6ZN10"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const GOOGLE_SHEETS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxzRYaoBoq3gKN3JAxC2ss3QwFYnpTuYmoUv9m8BnowS66qXrOoOpgtf4vVKmAULVf7/exec";

    const loginScreen = document.getElementById('login-screen');
    const formScreen = document.getElementById('form-screen');
    const successScreen = document.getElementById('success-screen');
    const loginBtn = document.getElementById('google-login-btn');
    const manualRegistrationBtn = document.getElementById('manual-registration-btn');
    const errorMsg = document.getElementById('error-msg');
    const regForm = document.getElementById('registration-form');
    const submitBtn = document.getElementById('submit-btn');
    const fullNameInput = document.getElementById('fullName');
    const emailInput = document.getElementById('email');

    manualRegistrationBtn.addEventListener('click', () => {
      fullNameInput.readOnly = false;
      emailInput.readOnly = false;
      fullNameInput.classList.remove('bg-transparent');
      emailInput.classList.remove('bg-transparent');
      document.getElementById('uid').value = '';
      loginScreen.classList.add('hidden');
      formScreen.classList.remove('hidden');
      fullNameInput.focus();
    });

    loginBtn.addEventListener('click', () => {
      loginBtn.disabled = true;
      loginBtn.innerHTML = 'Connecting...';
      errorMsg.classList.add('hidden');

      signInWithPopup(auth, provider)
        .then((result) => {
          const user = result.user;
          fullNameInput.value = user.displayName || '';
          emailInput.value = user.email || '';
          document.getElementById('uid').value = user.uid || '';
          
          loginScreen.classList.add('hidden');
          formScreen.classList.remove('hidden');
        })
        .catch((error) => {
          console.error(error);
          errorMsg.textContent = error.code === 'auth/configuration-not-found'
            ? 'Google Sign-In is not configured for this Firebase project. Enable Google sign-in in Firebase Console, then try again.'
            : `Firebase Error: ${error.message}`;
          errorMsg.classList.remove('hidden');
          loginBtn.disabled = false;
          loginBtn.innerHTML = `
            <svg class="w-5 h-5" viewBox="0 0 24 24">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Try Again
          `;
        });
    });

    regForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Submitting...';

      const formData = new FormData(regForm);
      formData.append('timestamp', new Date().toISOString());

      fetch(GOOGLE_SHEETS_WEB_APP_URL, {
        method: 'POST',
        body: formData
      })
      .then(response => response.json())
      .then(data => {
        if(data.result === "success") {
          formScreen.classList.add('hidden');
          successScreen.classList.remove('hidden');
        } else {
          throw new Error('Script returned error');
        }
      })
      .catch((error) => {
        console.error('Error!', error.message);
        alert('There was an error saving your data. Please try again.');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Complete Registration';
      });
    });
  </script>
</body>
</html>
